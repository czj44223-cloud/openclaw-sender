<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <style>
 body {
  width: 320px;
  padding: 16px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
 }
 h1 {
  font-size: 16px;
  margin: 0 0 12px 0;
  color: #333;
 }
 .status {
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 12px;
 }
 .status.connected {
  background: #d4edda;
  color: #155724;
 }
 .status.disconnected {
  background: #f8d7da;
  color: #721c24;
 }
 button {
  width: 100%;
  padding: 10px;
  margin-bottom: 8px;
  border: none;
  border-radius: 6px;
  background: #0066cc;
  color: white;
  font-size: 14px;
  cursor: pointer;
 }
 button:hover {
  background: #0052a3;
 }
 button:disabled {
  background: #ccc;
  cursor: not-allowed;
 }
 .info {
  font-size: 12px;
  color: #666;
  margin-top: 8px;
 }
 </style>
</head>
<body>
 <h1>🦞 OpenClaw Bridge</h1>
 <div id="status" class="status">检查连接中...</div>
 <button id="sendPage">发送当前页面</button>
 <button id="sendSelection">发送选中内容</button>
 <div class="info">
  右键点击页面或选中文本，也可以快速发送
 </div>
 <script src="popup.js"></script>
</body>
</html>
